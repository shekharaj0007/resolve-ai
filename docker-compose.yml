services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resolve
      POSTGRES_PASSWORD: resolve
      POSTGRES_DB: resolveai
    ports:
      - "5432:5432"
    volumes:
      - resolve_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolve -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  resolve_pg:
